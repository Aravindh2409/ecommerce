# =====================================================
# Spring Boot Application Configuration
# =====================================================

# Application
spring.application.name=ecommerce-backend

# Server Configuration
server.port=8080
server.servlet.context-path=/

# =====================================================
# Database Configuration (MySQL)
# =====================================================

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# =====================================================
# JPA/Hibernate Configuration
# =====================================================

# JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# JPA Auditing
spring.jpa.auditing.enabled=true

# =====================================================
# JWT Configuration
# =====================================================

# JWT Secret Key (min 256 bits for HS512)
app.jwt.secret=my-super-secret-key-that-is-at-least-256-bits-long-for-hs512-algorithm

# JWT Expiration Time (24 hours in milliseconds)
app.jwt.expiration=86400000

# =====================================================
# Logging Configuration
# =====================================================

# General Logging
logging.level.root=INFO
logging.level.com.ecommerce.backend=DEBUG

# SQL Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Connection Pool Logging
logging.level.com.zaxxer.hikari=INFO

# =====================================================
# Security Configuration (Optional - for future use)
# =====================================================

# JWT Configuration (uncomment when implementing security)
# jwt.secret=mySecretKey
# jwt.expiration=86400000

# =====================================================
# File Upload Configuration
# =====================================================

# Multipart file upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

